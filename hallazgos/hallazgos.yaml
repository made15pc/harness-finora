    afirmacion: "Antes de 2023-06, las industrias cuya mediana de ticket_inicial (antes) está bajo la mediana general (antes) suman el {valor}% de los clientes nuevos."
    tipo: hecho
    consulta: >-
      select sum(a.participacion)
      from adquisicion_industria a
      where a.periodo = 'antes'
        and a.Industria in (
            select Industria from adquisicion_industria
            where periodo = 'antes'
              and ticket_inicial_mediana < (select median(monto_recurrente) from cliente_mes where estado = 'nuevo' and month < '2023-06')
        )
    valor: 29.92
    estado: aprobado

