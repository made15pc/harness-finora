  - id: H13
    pregunta: P02
    afirmacion: "El {valor}% de la contracción total 2022-2024 ocurre en el mes siguiente a un retorno_pausa del mismo cliente."
    tipo: hecho
    consulta: >-
      select round(100 * post_pausa / total, 2)
      from (
          select sum(monto_recurrente - monto_recurrente_anterior) as post_pausa
          from (
              select
                  estado,
                  monto_recurrente,
                  lag(estado)           over (partition by ID order by month) as estado_anterior,
                  lag(monto_recurrente) over (partition by ID order by month) as monto_recurrente_anterior
              from cliente_mes
          )
          where estado = 'activo'
            and estado_anterior = 'retorno_pausa'
            and monto_recurrente < monto_recurrente_anterior
      ),
      (select sum(contraccion) as total from puente_mrr)
    valor: 24.14
    estado: aprobado

