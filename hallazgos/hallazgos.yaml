  - id: H07
    pregunta: P02
    afirmacion: "La contracción en el mes siguiente a un retorno_pausa, para el mismo cliente, suma {valor} en todo el período."
    tipo: hecho
    consulta: >-
      select sum(monto_recurrente - monto_recurrente_anterior)
      from (
          select
              estado,
              monto_recurrente,
              lag(estado)           over (partition by ID order by month) as estado_anterior,
              lag(monto_recurrente) over (partition by ID order by month) as monto_recurrente_anterior
          from cliente_mes
      )
      where estado = 'activo'
        and estado_anterior = 'retorno_pausa'
        and monto_recurrente < monto_recurrente_anterior
    valor: -14300097.84
    estado: aprobado

  - id: H08
    pregunta: P02
    afirmacion: >-
      Con la regla de churn de 3 meses, la contracción supera al churn en 2022 y 2023; con la regla
      de 1 mes ocurre lo contrario, así que la comparación depende de la definición. En 2024 la
      comparación es no concluyente: el churn está truncado y la salida_pendiente, si termina siendo
      churn, puede invertir el resultado. Además, una parte de la contracción ocurre el mes siguiente
      a un retorno de pausa, coherente con pagos atrasados no capturados por monto_recurrente (en ese
      caso la contracción como componente estaría inflada, con su contrapartida en retorno_pausa), pero
      también con reducciones reales de plan o pagos parciales. Sin precio de lista no se puede saber
      qué parte es descuento.
    tipo: inferencia
    basada_en: [H09, H02, H11, H10, H03, H04, H06, H14, H15, H05, H13]
    estado: aprobado

